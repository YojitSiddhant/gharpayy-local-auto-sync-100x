name: CI
on:
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      # No MySQL service in CI: MySQL-backed tests are SKIPPED and each skip is listed with its reason (-rs).
      # Locally, REQUIRE_MYSQL_TESTS=1 turns those skips into failures so database coverage is never assumed.
      - run: pytest backend/tests -rs
